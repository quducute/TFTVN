name: Matches

on:
  schedule:
    - cron: "41 */6 * * *"
  workflow_dispatch:
    inputs:
      players:
        description: "So nguoi choi moi bac (mac dinh 10)"
        required: false
        type: string
      matches:
        description: "So tran moi nguoi choi (mac dinh 10)"
        required: false
        type: string

permissions:
  contents: read

concurrency:
  group: matches
  cancel-in-progress: false

jobs:
  sync-matches:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 26
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Sync ranked matches
        env:
          DATABASE_URL_DIRECT: ${{ secrets.DATABASE_URL_DIRECT }}
          RIOT_API_KEY: ${{ secrets.RIOT_API_KEY }}
          REVALIDATE_URL: ${{ secrets.REVALIDATE_URL }}
          REVALIDATE_SECRET: ${{ secrets.REVALIDATE_SECRET }}
          PLAYERS: ${{ inputs.players || '10' }}
          MATCHES: ${{ inputs.matches || '10' }}
        run: pnpm etl sync-matches --players "$PLAYERS" --matches "$MATCHES"
